[build-system]
requires = ["hatchling>=1.27", "hatch-vcs>=0.4"]
build-backend = "hatchling.build"

[project]
name = "lumos-maxima"
description = "Lumos is a Universal and Modular Optical Simulator & Operating System"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Vincent Foriel", email = "vincent.foriel@gmail.com" }]
keywords = ["optics", "astronomy", "instrumentation", "wavefront propagation", "simulation", "photonics"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Physics",
    "Typing :: Typed",
]
dynamic = ["version"]
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "astropy>=6.1",
    "sympy>=1.13",
    "matplotlib>=3.9",
    "pyyaml>=6.0",
    "platformdirs>=4.0",
    "array-api-compat>=1.9",
    "jsonschema>=4.23",
    "psutil>=5.9",
    "vfscitools>=0.1",
]

[project.optional-dependencies]
jax = ["jax>=0.4.30"]
gpu = ["cupy-cuda12x>=13.0"]
torch = ["torch>=2.4"]
catalogs = ["astroquery>=0.4.7", "pyvo>=1.5", "requests>=2.32"]
hardware = ["pyserial>=3.5", "pyvisa>=1.14"]
web = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "argon2-cffi>=23.1"]
mcp = ["mcp>=1.2"]
ai = ["numpyro>=0.15", "optax>=0.2", "blackjax>=1.2"]
validation = ["poppy>=1.1", "hcipy>=0.6"]
hdf5 = ["h5py>=3.10"]
docs = [
    "sphinx>=8.0",
    "sphinx-breeze-theme>=0.13",
    "myst-parser>=4.0",
    "myst-nb>=1.1",
    "sphinxcontrib-mermaid>=1.0",
    "sphinx-copybutton>=0.5",
    "sphinx-intl>=2.2",
    "linkify-it-py>=2.0",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "pytest-benchmark>=4.0",
    "packaging>=24.0",
    "ruff>=0.6",
    "pyright>=1.1.380",
    "pre-commit>=3.8",
    "build>=1.2",
    "h5py>=3.10",
]
all = ["lumos-maxima[jax,catalogs,hardware,web,mcp]"]

[project.urls]
Homepage = "https://github.com/VForiel/LUMOS"
Repository = "https://github.com/VForiel/LUMOS"
Issues = "https://github.com/VForiel/LUMOS/issues"
Changelog = "https://github.com/VForiel/LUMOS/blob/main/CHANGELOG.md"

# --- Build -------------------------------------------------------------------

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
# No "+g<hash>" local part, so development builds can be uploaded to TestPyPI.
local_scheme = "no-local-version"

[tool.hatch.build.targets.wheel]
packages = ["src/lumos"]

[tool.hatch.build.targets.sdist]
include = ["src/lumos", "tests", "LICENSE", "README.md", "CHANGELOG.md"]

# --- Lint and format ---------------------------------------------------------

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["docs/_build"]

[tool.ruff.lint]
select = [
    "E", "W", "F",  # pycodestyle, pyflakes
    "I",            # isort
    "B",            # bugbear
    "UP",           # pyupgrade
    "SIM",          # simplify
    "NPY",          # NumPy-specific rules
    "PT",           # pytest style
    "RUF",          # ruff-specific rules
    "D",            # docstrings (NumPy convention)
    "ANN",          # type annotations on public code
    "T20",          # no print
    "S301",         # no pickle
    "S501",         # no requests with verify=False
]
ignore = [
    # Physics notation uses Greek letters (λ, θ, φ...) in identifiers, strings and comments.
    "RUF001", "RUF002", "RUF003",
    # Any is legitimate at the boundary with untyped scientific libraries.
    "ANN401",
]

[tool.ruff.lint.isort]
known-first-party = ["lumos"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "ANN", "PT011", "RUF059", "SIM300"]  # PT011: exception type only; RUF059: readable
# unpacking; SIM300: "CALLS == Counter(...)" is not a Yoda condition
"tools/**" = ["D100", "D103", "T20", "ANN"]
"docs/**" = ["D", "ANN"]

# --- Type checking -----------------------------------------------------------

[tool.pyright]
include = ["src", "tests", "tools"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
# Tests deliberately misuse the API (invalid arguments, forbidden overrides, dynamic attributes)
# to check that it is refused at runtime. reportCallIssue is off there because astropy's stubs type
# Quantity.to_value() as a union that NumPy overloads and operators reject (same for operators, indexing and Quantity.unit, typed Optional).
executionEnvironments = [
    { root = "tests", reportArgumentType = "none", reportCallIssue = "none", reportOperatorIssue = "none", reportIndexIssue = "none", reportOptionalMemberAccess = "none", reportAttributeAccessIssue = "none", reportIncompatibleMethodOverride = "none", reportIncompatibleVariableOverride = "none", reportAssignmentType = "none" },
    { root = "src" },
    { root = "tools" },
]

# --- Tests -------------------------------------------------------------------

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config", "-m", "not network and not hardware and not gpu and not benchmark"]
xfail_strict = true
filterwarnings = ["error"]
markers = [
    "network: needs internet access (catalog queries)",
    "hardware: needs real equipment connected",
    "gpu: needs a GPU backend",
    "slow: long-running test",
    "benchmark: performance measurement (run with -m benchmark)",
]

[tool.coverage.run]
source = ["lumos"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]
