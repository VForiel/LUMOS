[build-system]
requires = ["hatchling>=1.27", "hatch-vcs>=0.4"]
build-backend = "hatchling.build"

[project]
name = "lumos-maxima"
description = "Lumos is a Universal and Modular Optical Simulator & Operating System"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Vincent Foriel", email = "vincent.foriel@gmail.com" }]
keywords = ["optics", "astronomy", "instrumentation", "wavefront propagation", "simulation", "photonics"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Physics",
    "Typing :: Typed",
]
dynamic = ["version"]
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "astropy>=6.1",
    "sympy>=1.13",
    "matplotlib>=3.9",
    "pyyaml>=6.0",
    "platformdirs>=4.0",
    "array-api-compat>=1.9",
]

[project.optional-dependencies]
jax = ["jax>=0.4.30"]
gpu = ["cupy-cuda12x>=13.0"]
torch = ["torch>=2.4"]
catalogs = ["astroquery>=0.4.7", "pyvo>=1.5", "requests>=2.32"]
hardware = ["pyserial>=3.5", "pyvisa>=1.14"]
web = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "argon2-cffi>=23.1"]
mcp = ["mcp>=1.2"]
ai = ["numpyro>=0.15", "optax>=0.2", "blackjax>=1.2"]
validation = ["poppy>=1.1", "hcipy>=0.6"]
docs = [
    "sphinx>=8.0",
    "sphinx-breeze-theme>=0.13",
    "myst-parser>=4.0",
    "myst-nb>=1.1",
    "sphinxcontrib-mermaid>=1.0",
    "sphinx-copybutton>=0.5",
    "sphinx-intl>=2.2",
    "linkify-it-py>=2.0",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "packaging>=24.0",
    "ruff>=0.6",
    "pyright>=1.1.380",
    "pre-commit>=3.8",
    "build>=1.2",
]
all = ["lumos-maxima[jax,catalogs,hardware,web,mcp]"]

[project.urls]
Homepage = "https://github.com/VForiel/LUMOS"
Repository = "https://github.com/VForiel/LUMOS"
Issues = "https://github.com/VForiel/LUMOS/issues"
Changelog = "https://github.com/VForiel/LUMOS/blob/main/CHANGELOG.md"

# --- Build -------------------------------------------------------------------

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
# No "+g<hash>" local part, so development builds can be uploaded to TestPyPI.
local_scheme = "no-local-version"

[tool.hatch.build.targets.wheel]
packages = ["src/lumos"]

[tool.hatch.build.targets.sdist]
include = ["src/lumos", "tests", "LICENSE", "README.md", "CHANGELOG.md"]
