[build-system]
requires = ["hatchling>=1.27", "hatch-vcs>=0.4"]
build-backend = "hatchling.build"

[project]
name = "lumos-maxima"
description = "Lumos is a Universal and Modular Optical Simulator & Operating System"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Vincent Foriel", email = "vincent.foriel@gmail.com" }]
keywords = ["optics", "astronomy", "instrumentation", "wavefront propagation", "simulation", "photonics"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Physics",
    "Typing :: Typed",
]
dynamic = ["version"]
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "astropy>=6.1",
    "sympy>=1.13",
    "matplotlib>=3.9",
    "pyyaml>=6.0",
    "platformdirs>=4.0",
    "array-api-compat>=1.9",
    "jsonschema>=4.23",
    "psutil>=5.9",
    "pydantic>=2.7",  # typed messages of the service layer (lumos.service)
]

[project.optional-dependencies]
jax = ["jax>=0.4.30"]
gpu = ["cupy-cuda12x>=13.0"]
torch = ["torch>=2.4"]
catalogs = ["requests>=2.32"]
hardware = ["pyserial>=3.5", "pyvisa>=1.14"]
web = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "argon2-cffi>=23.1",  # password hashes (Argon2id)
    "cryptography>=42",  # verification of SSH signatures (lumos login)
]
mcp = ["mcp>=2.3,<3"]  # MCPServer API of the SDK 2 (ADR-0016)
ai = ["numpyro>=0.15", "optax>=0.2", "blackjax>=1.2"]
validation = ["poppy>=1.1", "hcipy>=0.6"]
hdf5 = ["h5py>=3.10"]
docs = [
    "sphinx>=8.0",
    "sphinx-breeze-theme>=0.13",
    "myst-parser>=4.0",
    "myst-nb>=1.1",
    "sphinxcontrib-mermaid>=1.0",
    "sphinx-copybutton>=0.5",
    "sphinx-intl>=2.2",
    "linkify-it-py>=2.0",
    "ipykernel>=6.29",  # execution of the example notebooks
    "requests>=2.32",  # catalogue layer used by the notebooks (answers from the recorded cache)
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "pytest-benchmark>=4.0",
    "packaging>=24.0",
    "ruff>=0.6",
    "pyright>=1.1.380",
    "pre-commit>=3.8",
    "build>=1.2",
    "h5py>=3.10",
    "nbclient>=0.10",
    "nbformat>=5.10",
    "ipykernel>=6.29",
    "httpx>=0.27",  # test client of the web backend
]
e2e = ["pytest-playwright>=0.5"]  # browser tests of the web interface (tests/e2e)
all = ["lumos-maxima[jax,catalogs,hardware,web,mcp]"]

[project.scripts]
lumos = "lumos.cli:main"

[project.urls]
Homepage = "https://github.com/VForiel/LUMOS"
Repository = "https://github.com/VForiel/LUMOS"
Issues = "https://github.com/VForiel/LUMOS/issues"
Changelog = "https://github.com/VForiel/LUMOS/blob/main/CHANGELOG.md"

# --- Build -------------------------------------------------------------------

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
# No "+g<hash>" local part, so development builds can be uploaded to TestPyPI.
local_scheme = "no-local-version"

[tool.hatch.build.targets.wheel]
packages = ["src/lumos"]
# the built web interface (npm run build in web/), ignored by git but shipped in wheels and images
artifacts = ["src/lumos/web/static/"]

[tool.hatch.build.targets.wheel.force-include]
# the presets shared by the notebooks, the web interface and the MCP server (lumos.service)
"examples/presets" = "lumos/presets"
# the community catalogue (ADR-0026): shared components and presets, data only
"community" = "lumos/community"

[tool.hatch.build.targets.sdist]
include = ["src/lumos", "tests", "examples/presets", "community", "LICENSE", "README.md", "CHANGELOG.md"]
# the built interface too: python -m build makes the wheel from the sdist
artifacts = ["src/lumos/web/static/"]

# --- Lint and format ---------------------------------------------------------

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["docs/_build", "src/lumos/_vendor"]  # vendored code kept as upstream
force-exclude = true  # also when pre-commit passes the files explicitly

[tool.ruff.lint]
select = [
    "E", "W", "F",  # pycodestyle, pyflakes
    "I",            # isort
    "B",            # bugbear
    "UP",           # pyupgrade
    "SIM",          # simplify
    "NPY",          # NumPy-specific rules
    "PT",           # pytest style
    "RUF",          # ruff-specific rules
    "D",            # docstrings (NumPy convention)
    "ANN",          # type annotations on public code
    "T20",          # no print
    "S301",         # no pickle
    "S501",         # no requests with verify=False
]
ignore = [
    # Physics notation uses Greek letters (λ, θ, φ...) in identifiers, strings and comments.
    "RUF001", "RUF002", "RUF003",
    # Any is legitimate at the boundary with untyped scientific libraries.
    "ANN401",
]

[tool.ruff.lint.isort]
known-first-party = ["lumos"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "ANN", "PT011", "RUF059", "SIM300"]  # PT011: exception type only; RUF059: readable
# unpacking; SIM300: "CALLS == Counter(...)" is not a Yoda condition
"tools/**" = ["D100", "D103", "T20", "ANN", "E501"]
"docs/**" = ["D", "ANN"]
"examples/**" = ["T20", "D", "ANN", "E501"]  # notebooks: prints, no docstrings, long plotting calls

# --- Type checking -----------------------------------------------------------

[tool.pyright]
include = ["src", "tests", "tools"]
exclude = ["src/lumos/_vendor"]  # vendored code kept as upstream
pythonVersion = "3.12"
typeCheckingMode = "standard"
# strict typing for the modules facing untrusted input or deciding access (P15.4); the readers of JSON
# documents (components, procedures, .lumos) validate at run time and are fuzzed (tests/unit/test_untrusted_documents.py)
strict = [
    "src/lumos/catalogue.py",
    "src/lumos/io/schema.py",
    "src/lumos/mcp/server.py",
    "src/lumos/web/auth.py",
    "src/lumos/web/config.py",
    "src/lumos/web/sessions.py",
]
venvPath = "."
venv = ".venv"
# Tests deliberately misuse the API (invalid arguments, forbidden overrides, dynamic attributes)
# to check that it is refused at runtime. reportCallIssue is off there because astropy's stubs type
# Quantity.to_value() as a union that NumPy overloads and operators reject (same for operators, indexing and Quantity.unit, typed Optional).
# Tests of optional dependencies import them when present: a missing one is a warning there.
executionEnvironments = [
    { root = "tests", reportArgumentType = "none", reportCallIssue = "none", reportOperatorIssue = "none", reportIndexIssue = "none", reportOptionalMemberAccess = "none", reportAttributeAccessIssue = "none", reportIncompatibleMethodOverride = "none", reportIncompatibleVariableOverride = "none", reportAssignmentType = "none", reportOptionalSubscript = "none", reportOptionalOperand = "none", reportRedeclaration = "none", reportMissingImports = "warning" },
    { root = "src" },
    { root = "tools" },
]

# --- Tests -------------------------------------------------------------------

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config", "-m", "not network and not hardware and not gpu and not benchmark and not e2e"]
xfail_strict = true
filterwarnings = ["error"]
markers = [
    "network: needs internet access (catalog queries)",
    "hardware: needs real equipment connected",
    "gpu: needs a GPU backend",
    "slow: long-running test",
    "benchmark: performance measurement (run with -m benchmark)",
    "e2e: browser tests of the web interface (Playwright, built frontend; run with -m e2e)",
]

[tool.coverage.run]
source = ["lumos"]
branch = true

[tool.coverage.report]
# 90 % measured at P15.4 (2026-10-21); the floor leaves room for code paths of other platforms
fail_under = 88
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]
