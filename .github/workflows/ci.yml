name: CI

on:
  push:
    branches: [main]
    # a contribution to the catalogue alone runs its own checks only (community.yml, ADR-0026)
    paths-ignore: ["community/**"]
  pull_request:
    paths-ignore: ["community/**"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # hatch-vcs needs the history to compute the version
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m venv .venv && .venv/bin/python -m pip install -e ".[dev,jax,mcp,web,hardware]"
      - run: .venv/bin/python -m pyright

  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.12", "3.13", "3.14"]
    env:
      HYPOTHESIS_PROFILE: ci
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev,jax,mcp,web,hardware]"
      - run: python -m pytest --cov --cov-report=term

  web:
    # Frontend of the web interface: unit tests (Vitest), type check and build.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  e2e:
    # The web interface in Chromium (Playwright), in English and in French.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: npm ci && npm run build
        working-directory: web
      - run: python -m pip install -e ".[dev,web,mcp,e2e]"
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest -m e2e tests/e2e -ra
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/

  docker:
    # The single-machine image (local profile): build it, start it, check its health and its interface.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f deploy/Dockerfile -t lumos:ci .
      - run: docker run -d --name lumos -p 127.0.0.1:8000:8000 lumos:ci
      - name: Wait for the health check
        run: |
          for i in $(seq 1 60); do curl -fs http://127.0.0.1:8000/api/health && break; sleep 2; done
          curl -fs http://localhost:8000/api/info
          curl -fs http://localhost:8000/ | grep -q '<div id="root">'
      - if: failure()
        run: docker logs lumos

  validation:
    # Comparisons with independent libraries (POPPY, HCIPy): extra [validation].
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e ".[dev,validation]"
      - run: python -m pytest tests/cross -ra

  docs:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        language: [en, fr]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e ".[docs,mcp,web]"
      - run: python -m sphinx -W --keep-going -b html -D language=${{ matrix.language }} docs docs/_build/html/${{ matrix.language }}

  test-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Determine the commit range
        id: range
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "range=${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            echo "range=${{ github.sha }}~1..${{ github.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "range=${{ github.event.before }}..${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi
      - run: python tools/check_test_integrity.py "${{ steps.range.outputs.range }}"
