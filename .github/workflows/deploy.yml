name: Deploy

# Updates the public instance (https://lumos.vincent.foriel.pro, VPS1) once CI or the catalogue checks pass on main.
# DEPLOY_SSH_KEY can only run ~/deploy/gate.sh lumos on VPS1 (forced command in authorized_keys), which runs
# deploy/public/update.sh; VPS1_KNOWN_HOSTS pins the host key of the server.

on:
  workflow_run:
    workflows: [CI, Community catalogue]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://lumos.vincent.foriel.pro
    steps:
      - name: Deploy on VPS1
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS1_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy -o IdentitiesOnly=yes -o BatchMode=yes ubuntu@152.228.240.129 prod
