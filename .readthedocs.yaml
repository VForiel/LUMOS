# Read the Docs configuration, shared by the English project and its French translation project.
# Read the Docs passes the project language to Sphinx, which then uses docs/locales/<lang>.
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.13"

sphinx:
  configuration: docs/conf.py
  fail_on_warning: true

python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - docs
